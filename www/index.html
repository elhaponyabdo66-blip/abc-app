<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B2545">
<title>مدرسة ABC</title>
<style>
:root{--bg:#EEF3F6;--ink:#0B2545;--mut:#5A6B7E;--card:#fff;--line:#D5DEE6;--g:#0F8B5F;--r:#D1332E;--n:#0B2545;--a:#E0A526;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root{--bg:#08151F;--ink:#E8EEF3;--mut:#93A4B5;--card:#10222F;--line:#1F3445;--n:#1D4577}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:system-ui,"Segoe UI",Tahoma,sans-serif;line-height:1.6;min-height:100vh}
.wrap{max-width:520px;margin:0 auto;padding:16px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.logo{display:flex;gap:4px;direction:ltr}
.logo b{width:30px;height:38px;border-radius:8px;display:grid;place-items:center;color:#fff;font:800 18px Arial,sans-serif;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.logo b:nth-child(1){background:var(--g)}.logo b:nth-child(2){background:var(--r)}.logo b:nth-child(3){background:var(--a);color:#1a1200}
h1{font-size:20px;margin:0;line-height:1.2}
.top p{margin:0;color:var(--mut);font-size:13px}
h2{font-size:24px;margin:0 0 4px}
h3{font-size:18px;margin:18px 0 8px}
.lead{margin:0 0 18px;color:var(--mut)}
.mu{color:var(--mut);font-size:13px;margin:0 0 8px}
.g{--bgc:var(--g);--fg:#fff}.r{--bgc:var(--r);--fg:#fff}.n{--bgc:var(--n);--fg:#fff}.a{--bgc:var(--a);--fg:#1a1200}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tile{background:var(--bgc);color:var(--fg);border:0;border-radius:20px;min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:700 18px inherit;font-family:inherit;cursor:pointer;box-shadow:0 7px 0 rgba(0,0,0,.28);animation:drop .5s cubic-bezier(.3,1.4,.5,1) both}
.tile:nth-child(2){animation-delay:.08s}.tile:nth-child(3){animation-delay:.16s}.tile:nth-child(4){animation-delay:.24s}
.tile:active{transform:translateY(5px);box-shadow:0 2px 0 rgba(0,0,0,.28)}
.ltr{font-size:64px;font-weight:800;line-height:1}
@keyframes drop{from{opacity:0;transform:translateY(-24px) rotate(-3deg)}}
.hero{background:var(--bgc);color:var(--fg);border-radius:20px;padding:18px;display:flex;align-items:center;gap:16px;box-shadow:0 6px 0 rgba(0,0,0,.28);margin-bottom:20px}
.hero .ltr{font-size:52px}.hero p{margin:0;opacity:.92}
.fld{display:block;font-size:14px;color:var(--mut);margin-bottom:16px}
select,input,textarea{display:block;width:100%;margin-top:6px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:16px inherit;font-family:inherit}
.list{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:14px;text-align:start;width:100%;padding:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;font-family:inherit;cursor:pointer}
.bd{flex:none;width:44px;height:44px;border-radius:12px;background:var(--bgc,var(--n));display:grid;place-items:center;font-size:22px;font-weight:800;color:#fff}
.tx{flex:1;display:flex;flex-direction:column}.tx strong{font-size:16px}.tx small{color:var(--mut);font-size:13px}
.row em{font-style:normal;font-size:12px;color:var(--mut);border:1px solid var(--line);border-radius:99px;padding:2px 10px;white-space:nowrap}
.row em.ok{color:var(--g);border-color:var(--g)}
.link{margin-top:18px;background:none;border:0;color:var(--mut);font:14px inherit;font-family:inherit;text-decoration:underline;cursor:pointer}
.btn{width:100%;margin:6px 0 18px;background:var(--g);color:#fff;border:0;border-radius:12px;padding:14px;font:700 16px inherit;font-family:inherit;box-shadow:0 4px 0 rgba(0,0,0,.28);cursor:pointer}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.28)}
.btn:disabled{opacity:.6}
.b2{background:var(--n)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.two .btn{margin:0}
.stat{display:inline-block;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:2px 14px;margin:0 0 14px;color:var(--mut)}
.stat b{color:var(--ink)}
.del{flex:none;background:none;border:0;color:var(--r);font-size:20px;padding:6px 10px;cursor:pointer}
.st{cursor:default}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:14px 0}
.card h3{margin:0 0 2px}.card h4{margin:14px 0 4px;color:var(--g)}
.card ul,.card ol{margin:0;padding-inline-start:22px}
.card li{margin-bottom:4px}
.card li.ok{color:var(--g);font-weight:700}
.tip{background:var(--card);border:1px solid var(--a);border-radius:12px;padding:10px 12px;margin:8px 0 14px;font-size:14px}
#pv{display:block;max-width:100%;max-height:220px;border-radius:12px;margin:8px 0}
.fc{width:100%;height:auto;max-width:340px;display:block;margin:8px auto}
.fc rect{fill:var(--bg);stroke:var(--g);stroke-width:2}
.fc text{fill:var(--ink);font-size:12px}
.fc line{stroke:var(--mut);stroke-width:2}
.fc polygon{fill:var(--mut)}
#toast{position:fixed;inset-inline:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));max-width:488px;margin:auto;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:12px;opacity:0;transform:translateY(12px);transition:.25s;pointer-events:none}
#toast.on{opacity:1;transform:none}
:focus-visible{outline:3px solid var(--a);outline-offset:2px}
@media(prefers-reduced-motion:reduce){.tile{animation:none}#toast{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top"><div class="logo" aria-hidden="true"><b>A</b><b>B</b><b>C</b></div><div><h1>مدرسة ABC</h1><p>المنهج الليبي</p></div></header>
  <main id="app"></main>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
const API='https://abc-ai.elhaponyabdo66.workers.dev';
const DAILY=4;
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ROLES={
 student:{n:'طالب',l:'ط',c:'g',h:'راجع دروسك، والعب، واختبر نفسك'},
 teacher:{n:'معلم',l:'م',c:'r',h:'حضّر حصصك وامتحاناتك في دقائق'},
 parent:{n:'ولي أمر',l:'و',c:'n',h:'تابع مستوى ابنك خطوة بخطوة'},
 admin:{n:'إدارة',l:'إ',c:'a',h:'أدر الفصول والحضور والتقارير'}
};
const MODS={
 teacher:[['محضّر الدروس','صوّر الدرس واحصل على تحضير كامل ومخطط انسيابي',3,'lesson'],['بنك الامتحانات','أنشئ نماذج وصحّحها تلقائيًا',4],['متابعة الطلاب','الحضور والدرجات ونقاط الضعف',5],['المذكرات والملخصات','ملخصات جاهزة للطباعة',7]],
 student:[['ألعاب المراجعة','تحديات وبطاقات تلخّص المنهج',6],['امتحاناتي','حلّ الامتحانات وشاهد نتيجتك',4],['مذكراتي','ملخصات ومراجعات لكل مادة',7],['تقدّمي','نقاطك وشاراتك ومستواك',5]],
 parent:[['مستوى ابني','الدرجات ونقاط القوة والضعف',5],['الحضور والغياب','سجل الحضور اليومي',5],['رسائل المعلمين','تواصل مباشر مع المعلم',8]],
 admin:[['الطلاب والفصول','إضافة الطلاب وتوزيعهم',2,'students'],['الحضور','حضور الطلاب والمعلمين',5],['التقارير','تقارير شاملة للمدرسة',5]]
};
const STAGES=['الأول','الثاني','الثالث','الرابع','الخامس','السادس','السابع','الثامن','التاسع'].map(x=>'الصف '+x+' أساسي').concat(['الأول الثانوي','الثاني الثانوي','الثالث الثانوي']);
const SUBJ=[['اللغة العربية','Arabic'],['اللغة الإنجليزية','English'],['الرياضيات','Mathematics'],['العلوم','Science'],['الفيزياء','Physics'],['الكيمياء','Chemistry'],['الأحياء','Biology'],['الجيولوجيا','Geology'],['التربية الإسلامية','Islamic Studies'],['الاجتماعيات','Social Studies'],['التاريخ','History'],['الجغرافيا','Geography'],['الحاسوب','Computer'],['التربية الفنية','Art'],['التربية البدنية','Physical Education']];
let S={role:null,stage:0},D={students:[],lessons:[]},V='',CUR=null,CURT='',IMG=null;
try{Object.assign(S,JSON.parse(localStorage.getItem('abc')||'{}'))}catch(e){}
try{Object.assign(D,JSON.parse(localStorage.getItem('abc_d')||'{}'))}catch(e){}
D.lessons=(D.lessons||[]).filter(l=>l&&l.plan);
const save=()=>{try{localStorage.setItem('abc',JSON.stringify(S))}catch(e){}};
const saveD=()=>{try{localStorage.setItem('abc_d',JSON.stringify(D))}catch(e){}};
const getCode=()=>{try{return localStorage.getItem('abc_code')||''}catch(e){return ''}};
const getUid=()=>{try{let u=localStorage.getItem('abc_uid');if(!u){const a=new Uint8Array(12);crypto.getRandomValues(a);u=Array.from(a,x=>x.toString(16).padStart(2,'0')).join('');localStorage.setItem('abc_uid',u)}return u}catch(e){return 'anon'}};
const today=()=>new Date(Date.now()+7200000).toISOString().slice(0,10);
function leftText(){
 try{const o=JSON.parse(localStorage.getItem('abc_left')||'{}');if(o.day===today())return 'المتبقي اليوم: '+o.left+' من '+DAILY+' تحضيرات'}catch(e){}
 return 'لديك '+DAILY+' تحضيرات يوميًا';
}
function setLeft(n){
 try{localStorage.setItem('abc_left',JSON.stringify({day:today(),left:n}))}catch(e){}
 const e=$('#lf');if(e)e.textContent=leftText();
}
function render(){
 const app=$('#app');
 if(!ROLES[S.role]){
  app.innerHTML=`<section><h2>من يستخدم التطبيق؟</h2><p class="lead">اختر دورك لتظهر لك الأدوات المناسبة.</p><div class="tiles">${Object.entries(ROLES).map(([k,r])=>`<button class="tile ${r.c}" data-role="${k}"><span class="ltr">${r.l}</span><span>${r.n}</span></button>`).join('')}</div></section>`;
  return;
 }
 if(V==='students'&&S.role==='admin'){viewStudents();return}
 if(V==='lesson'&&S.role==='teacher'){viewLesson();return}
 const r=ROLES[S.role];
 app.innerHTML=`<section><div class="hero ${r.c}"><span class="ltr">${r.l}</span><div><h2>${r.n}</h2><p>${r.h}</p></div></div>
 <label class="fld">المرحلة الدراسية<select id="stage">${STAGES.map((s,i)=>`<option value="${i}"${i===S.stage?' selected':''}>${s}</option>`).join('')}</select></label>
 <div class="list ${r.c}">${MODS[S.role].map(m=>`<button class="row" data-t="${m[0]}" data-n="${m[2]}" data-k="${m[3]||''}"><span class="bd">${m[0][0]}</span><span class="tx"><strong>${m[0]}</strong><small>${m[1]}</small></span><em class="${m[3]?'ok':''}">${m[3]?'جاهز':'المرحلة '+m[2]}</em></button>`).join('')}</div>
 <button class="link" data-role="">تغيير الدور</button></section>`;
}
function viewStudents(){
 $('#app').innerHTML=`<section><button class="link" data-view="" style="margin:0 0 10px">→ رجوع</button>
 <h2>الطلاب والفصول</h2><div class="stat"><b id="cnt">0</b> طالب</div>
 <label class="fld">اسم الطالب<input id="nm" type="text" placeholder="الاسم الكامل" autocomplete="off"></label>
 <label class="fld">الصف<select id="stg">${STAGES.map((s,i)=>`<option value="${i}">${s}</option>`).join('')}</select></label>
 <label class="fld">رقم ولي الأمر (اختياري)<input id="ph" type="tel" placeholder="09XXXXXXXX" dir="ltr"></label>
 <button class="btn" id="add">إضافة الطالب</button>
 <label class="fld">بحث<input id="q" type="search" placeholder="ابحث باسم الطالب"></label>
 <label class="fld">تصفية حسب الصف<select id="fs"><option value="">كل الصفوف</option>${STAGES.map((s,i)=>`<option value="${i}">${s}</option>`).join('')}</select></label>
 <div class="list" id="lst"></div></section>`;
 listStudents();
}
function listStudents(){
 const q=($('#q').value||'').trim(),f=$('#fs').value;
 const a=D.students.filter(s=>(!q||s.name.includes(q))&&(f===''||String(s.stage)===f));
 $('#cnt').textContent=D.students.length;
 $('#lst').innerHTML=a.length?a.map(s=>`<div class="row st"><span class="bd">${esc(s.name[0]||'؟')}</span><span class="tx"><strong>${esc(s.name)}</strong><small>${esc(STAGES[s.stage]||'')}${s.phone?' · '+esc(s.phone):''}</small></span><button class="del" data-del="${s.id}" aria-label="حذف الطالب">✕</button></div>`).join(''):'<p class="lead">لا يوجد طلاب بعد. أضف أول طالب من الأعلى.</p>';
}
/* ---------- محضّر الدروس بالذكاء الاصطناعي ---------- */
function wrap(s,n){
 const w=String(s).split(/\s+/),L=[''];
 for(const x of w){const c=L[L.length-1],j=(c+' '+x).trim();if(j.length<=n)L[L.length-1]=j;else L.push(x)}
 if(L.length>2){L.length=2;L[1]=L[1].slice(0,n-1)+'…'}
 return L;
}
function flow(nodes){
 const H=46,G=26,W=300;let y=4,s='';
 nodes.forEach((t,i)=>{
  const ls=wrap(t,34),pill=i===0||i===nodes.length-1;
  s+=`<rect x="10" y="${y}" width="${W-20}" height="${H}" rx="${pill?23:8}"/>`;
  ls.forEach((l,j)=>{s+=`<text x="${W/2}" y="${y+(ls.length>1?20+j*15:28)}" text-anchor="middle">${esc(l)}</text>`});
  if(i<nodes.length-1){const a=y+H;s+=`<line x1="${W/2}" y1="${a}" x2="${W/2}" y2="${a+G-6}"/><polygon points="${W/2-5},${a+G-8} ${W/2+5},${a+G-8} ${W/2},${a+G-1}"/>`}
  y+=H+G;
 });
 return `<svg class="fc" viewBox="0 0 ${W} ${y-G+4}" role="img" aria-label="مخطط انسيابي">${s}</svg>`;
}
function makePrompt(L){
 const sj=SUBJ[L.subject],lang={ar:'العربية',en:'English',both:'العربية مع إبقاء المصطلحات الإنجليزية كما هي'}[L.lang];
 return `أنت خبير تربوي ومعلم متمرس في منهج دولة ليبيا. حضّر درسًا للمعلم.
المادة: ${sj[0]} (${sj[1]}). الصف: ${STAGES[S.stage]}. ${L.title?'عنوان الدرس: '+L.title+'.':''}
${L.text?'نص الدرس:\n'+L.text:'محتوى الدرس موجود في الصورة المرفقة (صفحة من الكتاب المدرسي). اقرأها بعناية بما فيها الجداول والأمثلة.'}
اعتمد على محتوى الدرس فقط، ولا تضف معلومات غير موجودة فيه إلا للتوضيح البسيط، وكن دقيقًا علميًا ولغويًا، واجعل المستوى مناسبًا للصف.
لغة التحضير: ${lang}.
أعد JSON فقط بهذا الشكل بالضبط:
{"title":"","objectives":["3 إلى 5 أهداف سلوكية قابلة للقياس"],"intro":["2 أو 3 أفكار للتمهيد"],"concepts":[{"term":"","meaning":""}],"explanation":["خطوات الشرح بالترتيب، 4 إلى 8"],"activities":["2 إلى 4 أنشطة مناسبة للمادة"],"questions":{"mcq":[{"q":"","options":["","","",""],"answer":0}],"tf":[{"q":"","answer":true}],"essay":[""]},"flow":["5 إلى 8 مراحل قصيرة (أقل من 8 كلمات) لمخطط انسيابي يلخص تسلسل الدرس"],"summary":["2 إلى 4 نقاط ملخص"]}
عدد الأسئلة: 4 اختيار من متعدد (answer هو رقم الخيار الصحيح من 0 إلى 3)، و3 صح وخطأ، و2 مقالية. إن تعذّرت قراءة الصورة أعد {"error":"السبب"}.`;
}
function planHTML(p,sj){
 const li=a=>(a||[]).map(x=>`<li dir="auto">${esc(x)}</li>`).join('');
 const q=p.questions||{};
 const cn=(p.concepts||[]).map(c=>`<li dir="auto"><b>${esc(c.term)}</b>: ${esc(c.meaning)}</li>`).join('');
 const mcq=(q.mcq||[]).map(m=>`<li dir="auto">${esc(m.q)}<ol type="a">${(m.options||[]).map((o,i)=>`<li${i===m.answer?' class="ok"':''}>${esc(o)}</li>`).join('')}</ol></li>`).join('');
 const tf=(q.tf||[]).map(m=>`<li dir="auto">${esc(m.q)} <span class="mu">(${m.answer?'صح':'خطأ'})</span></li>`).join('');
 return `<div class="card"><h3 dir="auto">${esc(p.title)}</h3><p class="mu">${sj[0]} — ${sj[1]} · ${STAGES[S.stage]}</p>
 <h4>الأهداف</h4><ul>${li(p.objectives)}</ul><h4>التمهيد</h4><ul>${li(p.intro)}</ul>
 <h4>المفاهيم الأساسية</h4><ul>${cn}</ul><h4>الشرح</h4><ol>${li(p.explanation)}</ol>
 <h4>الأنشطة</h4><ul>${li(p.activities)}</ul>
 <h4>أسئلة اختيار من متعدد</h4><ol>${mcq}</ol><p class="mu">الإجابة الصحيحة باللون الأخضر.</p>
 <h4>صح أم خطأ</h4><ol>${tf}</ol><h4>أسئلة مقالية</h4><ol>${li(q.essay)}</ol>
 <h4>الملخص</h4><ul>${li(p.summary)}</ul>
 <h4>مخطط انسيابي</h4>${flow((p.flow||[]).slice(0,8))}</div>`;
}
function planTxt(p,sj){
 const q=p.questions||{},L=(h,a)=>['',h,...(a||[]).map((x,i)=>(i+1)+'. '+x)];
 return [p.title,sj[0]+' - '+sj[1]+' - '+STAGES[S.stage],
  ...L('الأهداف',p.objectives),...L('التمهيد',p.intro),
  ...L('المفاهيم',(p.concepts||[]).map(c=>c.term+': '+c.meaning)),
  ...L('الشرح',p.explanation),...L('الأنشطة',p.activities),
  ...L('اختيار من متعدد',(q.mcq||[]).map(m=>m.q+' | '+(m.options||[]).map((o,i)=>String.fromCharCode(97+i)+') '+o).join('  ')+' | الإجابة: '+String.fromCharCode(97+(m.answer||0)))),
  ...L('صح أم خطأ',(q.tf||[]).map(m=>m.q+' ('+(m.answer?'صح':'خطأ')+')')),
  ...L('أسئلة مقالية',q.essay),...L('الملخص',p.summary),...L('مخطط الدرس',p.flow)].join('\n');
}
function viewLesson(){
 IMG=null;
 $('#app').innerHTML=`<section><button class="link" data-view="" style="margin:0 0 10px">→ رجوع</button>
 <h2>محضّر الدروس</h2><p class="lead" style="margin-bottom:6px">صوّر صفحة الدرس، وسيجهّز الذكاء الاصطناعي تحضيرًا كاملًا.</p>
 <p class="mu" id="lf">${leftText()}</p>
 <label class="fld">المادة<select id="sj">${SUBJ.map((s,i)=>`<option value="${i}">${s[0]} — ${s[1]}</option>`).join('')}</select></label>
 <label class="fld">لغة التحضير<select id="lg"><option value="ar">عربي</option><option value="en">English</option><option value="both">عربي + مصطلحات English</option></select></label>
 <label class="fld">عنوان الدرس (اختياري)<input id="lt" type="text" placeholder="مثال: الزمن الماضي البسيط" autocomplete="off"></label>
 <div class="two"><button class="btn b2" id="cam">📷 تصوير</button><button class="btn b2" id="gal">🖼️ من المعرض</button></div>
 <input id="fc" type="file" accept="image/*" capture="environment" hidden><input id="fg" type="file" accept="image/*" hidden>
 <img id="pv" alt="صفحة الدرس" hidden>
 <p class="mu" id="pg"></p>
 <label class="fld">أو اكتب/الصق نص الدرس (اختياري)<textarea id="tx" rows="5" dir="auto" placeholder="يمكنك الاكتفاء بالصورة."></textarea></label>
 <label class="fld" id="cdw"${getCode()?' hidden':''}>رمز المعلم (مرة واحدة فقط)<input id="cd" type="password" autocomplete="off" dir="ltr"></label>
 <button class="btn" id="gen">حضّر الدرس</button>
 <div id="out"></div>
 <h3>تحضيراتي المحفوظة</h3><div class="list" id="ls"></div></section>`;
 lessons();
}
function lessons(){
 $('#ls').innerHTML=D.lessons.length?D.lessons.map(l=>`<div class="row st" data-open="${l.id}" style="cursor:pointer"><span class="bd">${esc((l.title||'؟')[0])}</span><span class="tx"><strong>${esc(l.title)}</strong><small>${SUBJ[l.subject]?SUBJ[l.subject][0]:''}</small></span><button class="del" data-ldel="${l.id}" aria-label="حذف التحضير">✕</button></div>`).join(''):'<p class="mu">لا توجد تحضيرات محفوظة بعد.</p>';
}
function show(L){
 CUR=L;CURT=planTxt(L.plan,SUBJ[L.subject]);
 $('#out').innerHTML=planHTML(L.plan,SUBJ[L.subject])+'<div class="two"><button class="btn b2" id="sv">💾 حفظ</button><button class="btn b2" id="sh">📤 نسخ / مشاركة</button></div>';
 $('#out').scrollIntoView({behavior:'smooth'});
}
const TIPS='نصيحة: صوّر الصفحة بإضاءة جيدة وبشكل مستقيم من الأعلى بدون ظل أو انعكاس، وركّز على الدرس نفسه (جزء واحد من الصفحة أفضل من صفحة مزدحمة)، أو اكتب النص في الخانة أسفل الصورة.';
async function gen(){
 const L={title:$('#lt').value.trim(),subject:+$('#sj').value,lang:$('#lg').value,text:$('#tx').value.trim()};
 if(!IMG&&!L.text){toast('صوّر صفحة الدرس أو اكتب نصه أولًا');return}
 const code=getCode()||$('#cd').value.trim();
 if(!code){toast('أدخل رمز المعلم');return}
 const b=$('#gen'),pg=$('#pg');b.disabled=true;b.textContent='جارٍ التحضير…';pg.textContent='';
 try{
  const ac=new AbortController(),to=setTimeout(()=>ac.abort(),90000);
  const r=await fetch(API,{method:'POST',signal:ac.signal,headers:{'content-type':'application/json','x-app-code':code,'x-uid':getUid()},body:JSON.stringify({prompt:makePrompt(L),image:IMG,mime:'image/jpeg'})});
  clearTimeout(to);
  const d=await r.json().catch(()=>({}));
  if(r.status===401){try{localStorage.removeItem('abc_code')}catch(e){}$('#cdw').hidden=false;toast('الرمز غير صحيح');return}
  if(r.status===429){setLeft(0);toast(d.error||'استهلكت تحضيراتك اليومية');return}
  if(!d.text){toast('تعذّر التحضير: '+String(d.error||'لا يوجد رد').slice(0,120));return}
  let p;try{p=JSON.parse(d.text.replace(/^```json|```$/g,'').trim())}catch(e){toast('جاء الرد بصيغة غير مفهومة، أعد المحاولة');return}
  if(p.error){pg.innerHTML='<div class="tip">تعذّرت قراءة الصورة: '+esc(p.error)+'<br>'+esc(TIPS)+'</div>';toast('تعذّرت قراءة الصورة');return}
  try{localStorage.setItem('abc_code',code)}catch(e){}
  $('#cdw').hidden=true;
  if(typeof d.left==='number')setLeft(d.left);
  show({title:p.title||L.title||'درس',subject:L.subject,lang:L.lang,plan:p});
 }catch(e){toast(e.name==='AbortError'?'انتهت المهلة، أعد المحاولة':'تعذّر الاتصال، تأكد من الإنترنت')}
 finally{b.disabled=false;b.textContent='حضّر الدرس'}
}
const shrink=f=>new Promise((ok,no)=>{const u=URL.createObjectURL(f),i=new Image();i.onload=()=>{const k=Math.min(1,1600/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext('2d').drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);ok(c.toDataURL('image/jpeg',.85))};i.onerror=no;i.src=u});
async function pick(f){
 if(!f)return;
 try{const u=await shrink(f);IMG=u.split(',')[1];const p=$('#pv');p.src=u;p.hidden=false;$('#pg').textContent='تم اختيار الصورة. اضغط «حضّر الدرس».'}
 catch(e){toast('تعذّر فتح الصورة')}
}
async function share(txt,title){
 try{if(navigator.share){await navigator.share({title,text:txt});return}}catch(e){if(e.name==='AbortError')return}
 try{await navigator.clipboard.writeText(txt);toast('تم نسخ التحضير')}catch(e){toast('تعذّر النسخ')}
}
let tt;
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),3500)}
document.addEventListener('click',e=>{
 const a=e.target.closest('[data-role]');
 if(a){S.role=a.dataset.role||null;V='';save();render();window.scrollTo(0,0);return}
 const b=e.target.closest('[data-view]');
 if(b){V=b.dataset.view;render();window.scrollTo(0,0);return}
 if(e.target.closest('#add')){
  const name=$('#nm').value.trim();
  if(!name){toast('اكتب اسم الطالب أولًا');return}
  D.students.unshift({id:Date.now(),name,stage:+$('#stg').value,phone:$('#ph').value.trim()});
  saveD();$('#nm').value='';$('#ph').value='';listStudents();toast('تمت إضافة الطالب');return;
 }
 const d=e.target.closest('[data-del]');
 if(d){if(confirm('حذف هذا الطالب؟')){D.students=D.students.filter(s=>String(s.id)!==d.dataset.del);saveD();listStudents()}return}
 if(e.target.closest('#cam')){$('#fc').click();return}
 if(e.target.closest('#gal')){$('#fg').click();return}
 if(e.target.closest('#gen')){gen();return}
 if(e.target.closest('#sv')){if(CUR){D.lessons.unshift(Object.assign({},CUR,{id:Date.now()}));saveD();lessons();toast('تم حفظ التحضير')}return}
 if(e.target.closest('#sh')){share(CURT,CUR?CUR.title:'');return}
 const ld=e.target.closest('[data-ldel]');
 if(ld){if(confirm('حذف هذا التحضير؟')){D.lessons=D.lessons.filter(l=>String(l.id)!==ld.dataset.ldel);saveD();lessons()}return}
 const op=e.target.closest('[data-open]');
 if(op){const l=D.lessons.find(x=>String(x.id)===op.dataset.open);if(l){$('#sj').value=l.subject;$('#lg').value=l.lang;$('#lt').value=l.title||'';show(l)}return}
 const m=e.target.closest('.row');
 if(m&&m.dataset.k==='students'){V='students';render();window.scrollTo(0,0);return}
 if(m&&m.dataset.k==='lesson'){V='lesson';render();window.scrollTo(0,0);return}
 if(m&&m.dataset.t)toast('«'+m.dataset.t+'» تُضاف في المرحلة '+m.dataset.n+' من الخطة');
});
document.addEventListener('input',e=>{if(e.target.id==='q')listStudents()});
document.addEventListener('change',e=>{
 if(e.target.id==='stage'){S.stage=+e.target.value;save()}
 if(e.target.id==='fs')listStudents();
 if(e.target.id==='fc'||e.target.id==='fg'){pick(e.target.files[0]);e.target.value=''}
});
render();
</script>
</body>
</html>
